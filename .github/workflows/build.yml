name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      freeswitch_ref:
        description: 'FreeSWITCH ref to build against (branch/tag/sha)'
        required: false
        default: ''

jobs:
  build-linux:
    name: "Build against FreeSWITCH (${{ inputs.freeswitch_ref || 'master' }})"
    runs-on: ubuntu-latest
    container: signalwire/freeswitch-public-ci-base:bookworm-amd64
    env:
      FREESWITCH_REF: ${{ inputs.freeswitch_ref || 'master' }}
      PKG_CONFIG_PATH: /usr/local/lib/pkgconfig
    steps:
      - name: Checkout mod_nats
        uses: actions/checkout@v5

      - name: Install libnats build tools
        run: |
          # the CI base image carries SignalWire's token-gated apt repo; drop it
          grep -rl 'freeswitch.signalwire.com' /etc/apt/sources.list.d/ /etc/apt/sources.list 2>/dev/null | xargs -r rm -f
          apt-get update
          apt-get install -y --no-install-recommends cmake ca-certificates

      - name: Build and install libnats (nats.c)
        run: |
          git clone --depth 1 https://github.com/nats-io/nats.c /tmp/nats.c
          cmake -S /tmp/nats.c -B /tmp/nats.c/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DNATS_BUILD_WITH_TLS=ON \
            -DNATS_BUILD_STREAMING=OFF \
            -DNATS_BUILD_EXAMPLES=OFF
          cmake --build /tmp/nats.c/build --parallel
          cmake --install /tmp/nats.c/build
          ldconfig
          echo "libnats version: $(pkg-config --modversion libnats || pkg-config --modversion nats)"

      - name: Build FreeSWITCH core deps (sofia-sip, spandsp)
        run: |
          for repo in sofia-sip spandsp; do
            git clone --depth 1 https://github.com/freeswitch/$repo /tmp/$repo
            cd /tmp/$repo
            ./bootstrap.sh
            ./configure --prefix=/usr/local
            make -j"$(nproc)"
            make install
          done
          ldconfig
          pkg-config --modversion sofia-sip-ua spandsp

      - name: Fetch FreeSWITCH source
        run: |
          git clone --depth 1 --branch "$FREESWITCH_REF" https://github.com/signalwire/freeswitch /tmp/freeswitch

      - name: Integrate mod_nats into the tree
        run: |
          DEST=/tmp/freeswitch/src/mod/event_handlers/mod_nats
          mkdir -p "$DEST"
          cp mod_nats.c mod_nats.h nats_conn.c nats_proto.c nats_methods.c nats_events.c Makefile.am "$DEST"/
          # upstream modules.conf.in has no entry for this module - append it
          echo 'event_handlers/mod_nats' >> /tmp/freeswitch/build/modules.conf.in
          # avoid the libks dependency tree in CI
          sed -i -e 's|^endpoints/mod_verto$|#endpoints/mod_verto|' -e 's|^\(.*mod_signalwire\)$|#\1|' /tmp/freeswitch/build/modules.conf.in
          # FS hardcodes the per-module Makefile list in AC_CONFIG_FILES
          sed -i 's|^\tsrc/mod/event_handlers/mod_event_socket/Makefile$|\tsrc/mod/event_handlers/mod_event_socket/Makefile\n\tsrc/mod/event_handlers/mod_nats/Makefile|' /tmp/freeswitch/configure.ac
          grep -n 'mod_nats' /tmp/freeswitch/build/modules.conf.in /tmp/freeswitch/configure.ac

      - name: Bootstrap and configure FreeSWITCH
        run: |
          cd /tmp/freeswitch
          ./bootstrap.sh
          ./configure

      - name: Build mod_nats
        run: |
          cd /tmp/freeswitch
          make -j"$(nproc)" mod_nats
          find src/mod/event_handlers/mod_nats -name '*.so*' -o -name '*.la' | xargs ls -la

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod_nats-${{ inputs.freeswitch_ref || 'master' }}-linux
          path: /tmp/freeswitch/src/mod/event_handlers/mod_nats/.libs/mod_nats.so*
          if-no-files-found: error

  go-sdk:
    name: "Go SDK (vet + test)"
    runs-on: ubuntu-latest
    container: golang:1.26
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Vet and test
        working-directory: sdk/go
        run: |
          go vet ./...
          go test ./...

  wire-catalog:
    name: "Wire catalog drift check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Check method table / catalog / docs agreement
        run: python3 tests/check_catalog.py

  package-deb:
    name: "Package .deb (runtime bundle)"
    needs: build-linux
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Download module artifact
        uses: actions/download-artifact@v4
        with:
          name: mod_nats-${{ inputs.freeswitch_ref || 'master' }}-linux
          path: artifact
      - name: Assemble .deb
        shell: bash
        run: |
          set -e
          VER="$(dpkg-parsechangelog -S Version 2>/dev/null || echo 0.5.0)"
          PKGDIR="mod-nats_${VER}_amd64/DEBIAN"
          mkdir -p "$PKGDIR" "mod-nats_${VER}_amd64/usr/lib/freeswitch/mod" \
                          "mod-nats_${VER}_amd64/etc/freeswitch/autoload_configs"
          install -m 755 artifact/mod_nats.so mod-nats_${VER}_amd64/usr/lib/freeswitch/mod/mod_nats.so
          install -m 644 nats.conf.xml mod-nats_${VER}_amd64/etc/freeswitch/autoload_configs/nats.conf.xml
          {
            echo "Package: mod-nats"
            echo "Version: $VER"
            echo "Section: comm"
            echo "Priority: optional"
            echo "Architecture: amd64"
            echo "Depends: freeswitch (>= 1.10) | freeswitch-all, libnats3 | libnats4"
            echo "Description: NATS message bus control plane for FreeSWITCH"
            echo " JSON-RPC 2.0 call control over NATS with channel events, CDR and"
            echo " metrics publishing. Built against FreeSWITCH ${{ inputs.freeswitch_ref || 'master' }}."
          } > "$PKGDIR/control"
          dpkg-deb --build --root-owner-group "mod-nats_${VER}_amd64"
          dpkg-deb --info "mod-nats_${VER}_amd64.deb" | head -12
      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: mod-nats-deb
          path: "*.deb"
          if-no-files-found: error
